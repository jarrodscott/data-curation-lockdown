baseURL: https://jarrodscott.github.io/data-curation-lockdown/

title: Lessons & Readings
theme: ghostwriter
languageCode: en-us
copyright: STRI-CON
googleAnalytics: XXX
pygmentsUseClasses: true
pygmentsCodefences: true

markup:
  highlight:
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: true
    tabWidth: 2

privacy:
  disqus:
    disable: true
  googleAnalytics:
    anonymizeIP: true
    respectDoNotTrack: true
    useSessionStorage: false

author:
  name: STRI-CON
  profile: ""

taxonomies:
  tag: tags

params:
  mainSections:
    - post
    - page
  intro: true
  headline: Data 🗄️ Curation
  description: With R Markdown, GitHub, & Public Repositories
  github: "https://github.com/XXX"
  #gitlab: "https://gitlab.com/XXX"
  #linkedin: "https://linkedin.com/in/XXX/"
  #twitter: "https://twitter.com/XXX"
  #stackoverflow: "https://stackoverflow.com/users/XXX/YYY"
  #facebook: "https://www.facebook.com/username"
  #email: XXX@example.com
  opengraph: true
  shareTwitter: true
  rss: true
  shareFacebook: true
  shareLinkedIn: false
  dateFormat: "Mon, Jan 2, 2006"
  exponeaJsUrl: ""
  exponeaTarget: ""
  exponeaToken: ""
  exponeaTrackVisits: false
  readingTime: true
  readingTimeText: "Estimated reading time:"
  fathomUrl: ""
  fathomSiteId: ""
  # If you want to use plausible(https://plausible.io) for analytics, add this section
  plausibleAnalytics:
    domain: ""
    # Default value is plausible.io, overwrite this if you are self-hosting or using a custom domain
    serverURL: ""

permalinks:
  post: "/:year/:month/:day/:contentbasename/"

menu:
  main:
    - name: HOME
      url: /
      weight: 1
    - name: Course Description
      url: /page/about/
      weight: 2
    - name: Course Topics
      url: /page/topics/
      weight: 3
    - name: Self-Paced Tutorials
      url: /page/tutorials/
      weight: 4
    - name: Course Resources
      url: /page/resources/
      weight: 5

#module:
#  imports:
#  - path: github.com/jbub/ghostwriter

security:
  allowContent:
    - ".*"
  enableInlineShortcodes: true  

  markup:
  goldmark:
    renderer:
      unsafe: true
