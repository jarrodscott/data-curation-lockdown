on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

name: Blogdown Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Ensures Hugo themes downloaded as submodules are fetched

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            blogdown
            tidyverse

      - name: Install Hugo
        run: |
          Rscript -e 'blogdown::install_hugo(version = "auto")'

      - name: Build Blogdown Site
        run: |
          Rscript -e 'blogdown::build_site(local = FALSE, run_hugo = True)'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages