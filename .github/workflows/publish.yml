on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

name: Blogdown Publish

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compile Theme Styles via NPM
        run: |
          # Check if package.json is in the theme directory and compile it
          if [ -f "./themes/ghostwriter/package.json" ]; then
            cd ./themes/ghostwriter
            npm install
            npm run build
            cd ../..
          # Check if package.json is in the root directory instead
          elif [ -f "./package.json" ]; then
            npm install
            npm run build
          fi

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            blogdown
            rmarkdown
            knitr
            tidyverse
            DT
            Rcpp
            htmltools

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Blogdown Site
        run: |
          Rscript -e 'blogdown::build_site(local = FALSE, run_hugo = TRUE)'
          echo "=== DISABLING JEKYLL ENGINE ==="
          touch ./public/.nojekyll
          rm -f ./public/.gitignore
          echo "=== DIAGNOSTIC: STYLESHEET CHECK ==="
          grep -i 'rel="stylesheet"' ./public/index.html || echo "No links found"

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
