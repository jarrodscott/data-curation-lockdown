on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

name: Blogdown Publish

# Grant the workflow the necessary permissions to publish to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            blogdown
            rmarkdown
            knitr
            tidyverse
            DT
            Rcpp
            htmltools

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Blogdown Site
        run: |
          Rscript -e 'rmarkdown::render_site(encoding = "UTF-8")'
          hugo --gc --minify
          echo "=== REMOVING THE NESTED GITIGNORE ==="
          rm -f ./public/.gitignore
          echo "=== CHECKING CURRENT DIRECTORY COMTENTS ==="
          ls -la
          echo "=== CHECKING PUBLIC DIRECTORY CONTENTS ==="
          ls -la public || echo "No public folder found!"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          enable_jekyll: true

